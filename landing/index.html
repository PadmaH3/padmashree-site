<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Padmashree</title>
  <meta name="description" content="Padmashree makes everyday apps for visual thinkers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <main class="page">
    <section class="intro" aria-label="About">
      <p class="hello">Hi, I’m Padmashree.</p>
      <p class="where">
        From Bangalore
        <svg class="mini" viewBox="0 0 64 32" aria-hidden="true">
          <!-- raintree canopy with a gulmohar hint, and a coffee cup -->
          <path d="M6 18c-3 0-4-4-1-5 0-4 5-5 7-3 2-3 8-3 9 1 3 0 4 4 1 5" fill="#eef3e6" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <circle cx="11" cy="12" r="1.3" fill="#e2553b"/><circle cx="16" cy="10.5" r="1.1" fill="#e2553b"/><circle cx="19" cy="14" r="1" fill="#e2553b"/>
          <path d="M13 18v9M13 21l-3-3M13 22l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
          <path d="M34 17h12v7a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4z" fill="#fff" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M46 19h2a2.5 2.5 0 0 1 0 5h-2" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path class="steam" d="M38 14c-1-2 1-3 0-5M42 14c-1-2 1-3 0-5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        living in Karkala
        <svg class="mini" viewBox="0 0 64 32" aria-hidden="true">
          <!-- western ghats, coconut + banana, paddy -->
          <path d="M2 22l12-12 8 7 9-10 13 11 8-5 10 9" fill="#e9f0ec" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M44 26c0-6 1-10 3-13M47 13c-3-1-5 0-6 2M47 13c2-2 5-2 6 0M47 13c0-2 2-4 4-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M20 26v-6M20 21c-2-2-4-2-5-1M20 21c2-3 4-3 5-2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M1 26h62" stroke="currentColor" stroke-width="1.4"/>
          <path d="M6 30l1-4M11 30l1-4M16 30l1-4M30 30l1-4M35 30l1-4M52 30l1-4M57 30l1-4" stroke="#7fb069" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </p>
      <p class="what">Making everyday apps for visual thinkers and <a href="../little-one/">my 2&nbsp;year&nbsp;old</a>.</p>
    </section>

    <section class="apps" aria-label="Apps">
      <!-- Each app is a small deck: the main icon on top, its counterpart tucked beneath.
           Counterparts slide out as you scroll. -->
      <figure class="app app-blue">
        <div class="deck">
          <img class="card under" src="icons/blue-b.webp" alt="Hourglass under a blue sky" width="512" height="512" loading="lazy">
          <div class="card main" tabindex="0" aria-label="Blue app: a boy resting on his folded arms, watching clouds">
            <img src="icons/blue.webp" alt="" width="512" height="512">
            <span class="patch" style="--l:70;--t:8;--w:30;--h:33;--c:#0a84ff"></span>
            <span class="part cloud" style="--l:70;--t:8;--w:30;--h:33"><img src="icons/blue.webp" alt=""></span>
            <span class="lid lid-l" style="--x:38.5;--y:61.6"></span>
            <span class="lid lid-r" style="--x:55.2;--y:61.6"></span>
          </div>
        </div>
      </figure>

      <figure class="app app-yellow">
        <div class="deck">
          <img class="card under" src="icons/yellow-b.webp" alt="Sunflowers and light bulbs" width="512" height="512" loading="lazy">
          <div class="card main" tabindex="0" aria-label="Yellow app: a girl holding a sunflower, an idea bulb above">
            <img src="icons/yellow.webp" alt="" width="512" height="512">
            <span class="glow" style="--x:81;--y:22"></span>
            <span class="patch" style="--l:70;--t:3;--w:23;--h:35;--c:#ffd23f"></span>
            <span class="part bulb" style="--l:70;--t:3;--w:23;--h:35"><img src="icons/yellow.webp" alt=""></span>
          </div>
        </div>
      </figure>

      <figure class="app app-pink">
        <div class="deck">
          <img class="card under" src="icons/pink-b.webp" alt="A paper butterfly with scissors and glue" width="512" height="512" loading="lazy">
          <div class="card main" tabindex="0" aria-label="Pink app: a girl peeking through torn paper, a butterfly nearby">
            <img src="icons/pink.webp" alt="" width="512" height="512">
            <span class="patch" style="--l:6;--t:3;--w:23;--h:18;--c:#e94b7d"></span>
            <span class="part fly" style="--l:6;--t:3;--w:23;--h:18"><img src="icons/pink.webp" alt=""></span>
          </div>
        </div>
      </figure>
    </section>

    <div class="tail" aria-hidden="true"></div>
  </main>

  <nav class="social" aria-label="Elsewhere">
    <a href="https://x.com/PadmashreeSatya" target="_blank" rel="noopener" aria-label="X">
      <svg viewBox="0 0 24 24"><path class="fill" d="M17.75 3h2.9l-6.34 7.25L21.75 21h-5.84l-4.57-5.98L6.1 21H3.2l6.78-7.75L2.85 3h5.98l4.13 5.47zm-1.02 16.25h1.6L7.33 4.65H5.6z"/></svg>
    </a>
    <a href="#" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" class="dot"/></svg>
    </a>
    <a href="#" target="_blank" rel="noopener" aria-label="YouTube">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.2v5.6l4.8-2.8z" class="dot"/></svg>
    </a>
  </nav>

  <script src="landing.js"></script>
</body>
</html>
