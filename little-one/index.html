<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games for my 2 year old · Padmashree</title>
  <meta name="description" content="Small games Padmashree made for her 2 year old: monster trucks, letters and Kannada akshara.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
</head>
<body>
  <a class="home-link" href="../">← Padmashree</a>

  <main class="page">
    <section class="intro" aria-label="About">
      <p class="hello">Games for my 2 year old.</p>
      <p class="where">Made in the monster truck era.</p>
    </section>

    <section class="games" aria-label="Games">
      <article class="game">
        <a class="game-link" href="monster-truck-stack/">
          <img class="thumb" src="thumbs/monster-truck-stack.webp" alt="Truck Stack title screen: a smiling sun over green hills, with Space, Shift and Enter keys" width="800" height="500">
          <span class="game-title">Truck stack</span>
        </a>
        <p class="game-meta">Stack the trucks, then crash them</p>
        <p class="game-play">Keyboard</p>
      </article>

      <article class="game">
        <a class="game-link" href="letter-stickers/">
          <img class="thumb" src="thumbs/letter-stickers.webp" alt="Letter Stickers title screen on a green chalkboard" width="800" height="500">
          <span class="game-title">Letter stickers</span>
        </a>
        <p class="game-meta">Press a letter, get a sticker</p>
        <p class="game-play">Keyboard</p>
      </article>

      <article class="game">
        <a class="game-link" href="akshara-jodi/">
          <img class="thumb" src="thumbs/akshara-jodi.webp" alt="Akshara Jodi: a board of Kannada letter cards on a red patterned floor" width="800" height="500" loading="lazy">
          <span class="game-title">Akshara jodi</span>
        </a>
        <p class="game-meta">Find the Kannada letter pairs</p>
        <p class="game-play">Tap · <a href="akshara-jodi/akshara-jodi-cards.pdf">Printable cards</a></p>
      </article>

      <article class="game">
        <a class="game-link" href="truck-memory/">
          <img class="thumb" src="thumbs/truck-memory.webp" alt="Truck Match: choose a board size from 4 by 4 to 10 by 10" width="800" height="500" loading="lazy">
          <span class="game-title">Truck match</span>
        </a>
        <p class="game-meta">Find the matching trucks</p>
        <p class="game-play">Tap</p>
      </article>
    </section>
  </main>
</body>
</html>
