<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Truck Match</title>
<style>
  :root {
    --sky: #8fd3f4;
    --sky2: #d6f1ff;
    --grass: #6cc24a;
    --red: #ff5e5b;
    --yellow: #ffd23f;
    --blue: #2c5a96;
    --ink: #2b2b2b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation; }
  body {
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--sky) 0%, var(--sky2) 62%, var(--grass) 62.1%, #4fa233 100%);
  }
  button { font: inherit; cursor: pointer; border: 0; }

  /* ---------- menu ---------- */
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2.2vmin; padding: 3vmin; text-align: center; }
  #menu h1 { margin: 0; font-size: clamp(40px, 9vmin, 84px); letter-spacing: .02em; color: #fff;
    text-shadow: 0 .06em 0 var(--blue), 0 .12em 0 rgba(0,0,0,.18); }
  #menu .sun { font-size: clamp(50px, 12vmin, 110px); animation: bob 2.4s ease-in-out infinite; }
  .sizes { display: flex; flex-wrap: wrap; gap: 2vmin; justify-content: center; max-width: 900px; }
  .size { width: clamp(90px, 20vmin, 170px); aspect-ratio: 1; border-radius: 22px; background: #fff;
    border: 5px solid var(--blue); box-shadow: 0 .8vmin 0 var(--blue); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; font-weight: 900; font-size: clamp(20px, 4vmin, 34px);
    color: var(--blue); transition: transform .12s; }
  .size:active { transform: translateY(.6vmin) scale(.97); box-shadow: 0 .2vmin 0 var(--blue); }
  .size.last { background: var(--yellow); }
  .mini { display: grid; gap: 2px; width: 55%; aspect-ratio: 1; }
  .mini i { background: var(--red); border-radius: 2px; }
  .mini i:nth-child(3n) { background: var(--blue); }
  .mini i:nth-child(3n+1) { background: var(--yellow); }
  .home { position: fixed; left: 12px; top: 10px; color: var(--blue); font-weight: 900; text-decoration: none;
    background: rgba(255,255,255,.85); border-radius: 14px; padding: 6px 12px; font-size: 18px; }

  /* ---------- game ---------- */
  #game { position: fixed; inset: 0; display: none; }
  #game.show { display: block; }
  #board { position: absolute; left: 50%; top: calc(50% + 14px); transform: translate(-50%, -50%);
    display: grid; }
  .menu-btn { position: absolute; left: 10px; top: 8px; z-index: 5; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,.9); color: var(--blue); font-size: 22px; font-weight: 900; line-height: 1;
    box-shadow: 0 3px 0 var(--blue); border: 3px solid var(--blue); overflow: hidden; }
  .menu-btn::after { content: ""; position: absolute; inset: 0; background: rgba(44,90,150,.35);
    transform: translateY(100%); transition: transform 0s; }
  .menu-btn.holding::after { transform: translateY(0); transition: transform .7s linear; }
  .progress { position: absolute; top: 12px; left: 66px; right: 12px; height: 28px; display: flex;
    gap: 4px; align-items: center; z-index: 4; pointer-events: none; }
  .progress b { flex: 1; height: 100%; max-width: 30px; font-size: 20px; line-height: 28px; text-align: center;
    filter: grayscale(1) opacity(.35); transition: filter .3s, transform .3s; }
  .progress b.on { filter: none; transform: scale(1.25); }

  .card { position: relative; perspective: 600px; padding: var(--gap); }
  .card .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
  .card.up .inner { transform: rotateY(180deg); }
  .face, .back { position: absolute; inset: 0; border-radius: 16%; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .back { background:
      radial-gradient(circle at 50% 50%, #fff 0 14%, transparent 15%),
      repeating-conic-gradient(var(--red) 0 12.5%, #ff8a5e 0 25%);
    border: calc(var(--cell) * .05) solid #fff; box-shadow: 0 .5vmin 0 rgba(0,0,0,.25); }
  .back::after { content: "★"; color: var(--yellow); font-size: calc(var(--cell) * .42); line-height: 1;
    text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .face { transform: rotateY(180deg); background: #fff; border: calc(var(--cell) * .05) solid var(--blue);
    box-shadow: 0 .5vmin 0 rgba(0,0,0,.25); }
  .face img { width: 88%; height: 88%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  .card.matched .face { background: #fff7c2; border-color: var(--yellow); }
  .card.matched .inner { animation: hop .7s ease-out; }
  .card.wrong .inner { animation: shake .4s; }
  .card.free { pointer-events: none; }
  .card.free .back { background: none; border: 0; box-shadow: none; }
  .card.free .back::after { content: "☀️"; font-size: calc(var(--cell) * .6); color: initial; text-shadow: none; animation: bob 2.4s ease-in-out infinite; }

  .spark { position: fixed; pointer-events: none; z-index: 20; font-size: 28px; animation: fly 1s ease-out forwards; }

  /* ---------- win ---------- */
  #win { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vmin; background: rgba(255,255,255,.55); z-index: 30; backdrop-filter: blur(4px); }
  #win.show { display: flex; }
  #win h2 { margin: 0; font-size: clamp(44px, 12vmin, 110px); color: #fff; text-shadow: 0 .06em 0 var(--blue), 0 .12em 0 rgba(0,0,0,.2);
    animation: bob 1s ease-in-out infinite; }
  #win .trophy { font-size: clamp(70px, 20vmin, 180px); animation: bob 1.4s ease-in-out infinite; }
  .row { display: flex; gap: 3vmin; }
  .big { width: clamp(80px, 18vmin, 150px); height: clamp(80px, 18vmin, 150px); border-radius: 50%; background: var(--yellow);
    border: 6px solid var(--blue); box-shadow: 0 1vmin 0 var(--blue); font-size: clamp(36px, 9vmin, 70px); }
  .big:active { transform: translateY(.8vmin); box-shadow: 0 .2vmin 0 var(--blue); }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.4vmin); } }
  @keyframes shake { 0%,100% { transform: rotateY(180deg) translateX(0); } 25% { transform: rotateY(180deg) translateX(-6%); } 75% { transform: rotateY(180deg) translateX(6%); } }
  @keyframes hop { 0% { transform: rotateY(180deg) scale(1); } 35% { transform: rotateY(180deg) scale(1.22) rotate(-6deg); }
    65% { transform: rotateY(180deg) scale(1.12) rotate(6deg); } 100% { transform: rotateY(180deg) scale(1); } }
  @keyframes fly { 0% { transform: translate(0,0) scale(.4); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(240deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; } }
</style>
</head>
<body>

<a class="home" href="../">⌂ games</a>

<div id="menu">
  <div class="sun">🚚</div>
  <h1>Truck Match</h1>
  <div class="sizes" id="sizes"></div>
</div>

<div id="game">
  <button class="menu-btn" id="menuBtn" aria-label="Hold to go back to the menu">⌂</button>
  <div class="progress" id="progress"></div>
  <div id="board"></div>
</div>

<div id="win">
  <div class="trophy">🏆</div>
  <h2>Yay!</h2>
  <div class="row">
    <button class="big" id="again" aria-label="Play again">🔁</button>
    <button class="big" id="bigger" aria-label="Bigger board">➡️</button>
  </div>
</div>

<script>
// ---------- the trucks (same art as Truck Stack) ----------
const LIST = [["00","JCB Digger"],["01","Fire Truck"],["02","Police Car"],["03","Zombie"],["04","Shark"],["05","Skeleton"],["06","Triceratops"],["07","Witch"],["08","Ice"],["09","Tiger"],["10","Dragon"],["11","Unicorn"],["12","Commando"],["13","Ambulance"],["14","Earth Shaker"],["15","Hot Wheels"],["16","Maximum Destruction"],["17","El Toro Loco"],["18","Grave Digger"],["19","Bigfoot"],["20","Tank"],["21","School Bus"],["22","Fire Truck"],["23","Cement Mixer"],["24","Garbage Truck"],["25","Tow Truck"],["26","Ice Cream Truck"],["27","Monster Van"],["28","Dump Truck"],["29","Tractor"],["30","Bulldozer"],["31","Logging Truck"],["32","Dino Truck"],["33","Shark"],["34","Pirate Ship"],["35","Space Truck"],["36","Rescue Helicopter"],["37","Snow Plow"],["38","Harvester"],["39","Crane"],["40","Airplane"],["41","Rocket"],["42","Submarine"],["43","Music Truck"],["44","Grave Digger"],["45","Grave Digger"],["46","Megalodon"],["47","El Toro Loco"],["48","School Bus"],["49","Bigfoot"],["50","Monster Energy"],["51","Monster Mutt"],["52","Dragon"],["53","Son-uva Digger"],["54","USA-1"],["55","Raminator"],["56","Tiger Shark"],["57","Blaze"],["58","Rhino"],["59","Zombie"]];

const SIZES = [4, 5, 6, 7, 8, 9, 10];
const WRONG_MS = 1500;   // slow and gentle: time to look at both cards

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

// ---------- sounds (copied from Truck Stack: all made in the browser, no files) ----------
const sfx = (() => {
  let ac = null;
  const A = () => (ac ||= new (window.AudioContext || window.webkitAudioContext)());
  function tone(type, f0, f1, dur, vol = 0.3, delay = 0) {
    const a = A(), t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    ctx: A,
    unlock() { A().resume(); },
    flip() { tone('sine', 600, 900, 0.09, 0.12); },
    // the "boring" miss: one soft, sleepy two-note wobble
    miss() { tone('sine', 330, 250, 0.35, 0.14); tone('sine', 250, 200, 0.4, 0.1, 0.18); },
    cheer() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f, 0.3, 0.25, i * 0.12)); }
  };
})();

const vehicleSound = (() => {
  let bus = null;
  function voice(out, type, f, dur, vol, { delay = 0, step = false, lp = 0, trem = 0, tremDepth = 0.6 } = {}) {
    const a = sfx.ctx(), t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f[0][1], t);
    for (const [s, hz] of f.slice(1)) {
      if (step) o.frequency.setValueAtTime(hz, t + s);
      else o.frequency.linearRampToValueAtTime(hz, t + s);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.03);
    g.gain.setValueAtTime(vol, t + Math.max(0.04, dur - 0.08));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (lp) { const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; node.connect(fl); node = fl; }
    if (trem) {
      const tg = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
      lfo.frequency.value = trem; lg.gain.value = tremDepth; tg.gain.value = 1 - tremDepth;
      lfo.connect(lg).connect(tg.gain); lfo.start(t); lfo.stop(t + dur + 0.05);
      node.connect(tg); node = tg;
    }
    node.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function hiss(out, dur, vol, cut, { delay = 0, type = 'lowpass', q = 1, trem = 0, decay = false } = {}) {
    const a = sfx.ctx(), t = a.currentTime + delay;
    const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      let v = Math.random() * 2 - 1;
      if (decay) v *= (1 - i / d.length) ** 2;
      if (trem) v *= Math.sin(i / a.sampleRate * trem * Math.PI) ** 2;
      d[i] = v;
    }
    const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(cut[0][1], t);
    for (const [sec, hz] of cut.slice(1)) fl.frequency.linearRampToValueAtTime(hz, t + sec);
    g.gain.value = vol;
    s.connect(fl).connect(g).connect(out); s.start(t);
  }
  const note = n => 440 * 2 ** ((n - 69) / 12);
  const SOUNDS = {
    ambulance(o) { const f = []; for (let i = 0; i < 8; i++) f.push([i * 0.4, i % 2 ? 770 : 960]);
      voice(o, 'square', f, 3.2, 0.12, { step: true, lp: 2500 }); voice(o, 'triangle', f, 3.2, 0.2, { step: true }); },
    fire(o) { voice(o, 'sawtooth', [[0, 500], [1, 1300], [1.6, 1300], [2.6, 500], [3.2, 1300]], 3.4, 0.12, { lp: 3000 });
      voice(o, 'sine', [[0, 500], [1, 1300], [1.6, 1300], [2.6, 500], [3.2, 1300]], 3.4, 0.2); },
    police(o) { const f = []; for (let i = 0; i < 10; i++) { f.push([i * 0.28, 700]); f.push([i * 0.28 + 0.24, 1500]); }
      voice(o, 'square', f, 2.8, 0.1, { lp: 2800 }); voice(o, 'sine', f, 2.8, 0.2); },
    helicopter(o) { hiss(o, 2.5, 1.2, [[0, 500]], { trem: 13 });
      voice(o, 'sawtooth', [[0, 55], [2.5, 60]], 2.5, 0.15, { lp: 300, trem: 13, tremDepth: 0.9 }); },
    airplane(o) { hiss(o, 2.5, 0.9, [[0, 300], [1.3, 2500], [2.5, 400]], { type: 'bandpass', q: 0.7 });
      voice(o, 'sine', [[0, 700], [1.3, 1400], [2.5, 600]], 2.5, 0.08); },
    rocket(o) { [0, 0.45, 0.9].forEach(d => voice(o, 'square', [[0, 880]], 0.15, 0.1, { delay: d }));
      voice(o, 'square', [[0, 1320]], 0.3, 0.1, { delay: 1.35 });
      hiss(o, 2, 1.2, [[0, 200], [2, 4000]], { delay: 1.4 }); voice(o, 'sine', [[0, 200], [2, 1600]], 2, 0.15, { delay: 1.4 }); },
    tank(o) { [0, 0.9].forEach(d => { hiss(o, 1, 1.5, [[0, 900], [0.6, 100]], { delay: d, decay: true });
      voice(o, 'sine', [[0, 90], [0.6, 30]], 0.7, 0.6, { delay: d }); }); },
    bus(o) { [0, 0.45].forEach(d => [330, 415].forEach(hz => voice(o, 'square', [[0, hz]], 0.35, 0.1, { delay: d, lp: 1800 }))); },
    iceCream(o) { [72, 72, 79, 79, 81, 81, 79, 77, 77, 76, 76, 74, 74, 72].forEach((n, i) => {
      const d = i * 0.26 + (i >= 7 ? 0.26 : 0);
      voice(o, 'sine', [[0, note(n)]], 0.3, 0.25, { delay: d }); voice(o, 'sine', [[0, note(n + 12)]], 0.2, 0.06, { delay: d }); }); },
    music(o) { for (let i = 0; i < 8; i++) { const d = i * 0.25;
      if (i % 2 === 0) voice(o, 'sine', [[0, 150], [0.15, 45]], 0.2, 0.6, { delay: d });
      else hiss(o, 0.1, 0.5, [[0, 8000]], { delay: d, type: 'highpass', decay: true });
      voice(o, 'sawtooth', [[0, note([36, 36, 43, 43, 41, 41, 43, 48][i])]], 0.22, 0.12, { delay: d, lp: 900 }); } },
    submarine(o) { [0, 1.1].forEach(d => [0, 0.25, 0.5].forEach((e, k) => voice(o, 'sine', [[0, 1100]], 0.6, 0.3 / (k + 1), { delay: d + e }))); },
    ship(o) { [0, 1.4].forEach(d => { voice(o, 'sawtooth', [[0, 98], [1.1, 96]], 1.1, 0.25, { delay: d, lp: 500 });
      voice(o, 'sawtooth', [[0, 147], [1.1, 145]], 1.1, 0.12, { delay: d, lp: 500 }); }); },
    roar(o) { voice(o, 'sawtooth', [[0, 110], [0.3, 180], [1.4, 70]], 1.5, 0.35, { lp: 900, trem: 28, tremDepth: 0.5 });
      voice(o, 'square', [[0, 55], [0.3, 90], [1.4, 35]], 1.5, 0.15, { lp: 400 });
      hiss(o, 1.5, 0.6, [[0, 600], [0.3, 1500], [1.5, 300]], { type: 'bandpass', q: 1.5 }); },
    shark(o) { [0, 0.6, 1.05, 1.4, 1.65, 1.85, 2.0, 2.12].forEach((d, i) => voice(o, 'sawtooth', [[0, i % 2 ? 87 : 82]], 0.18, 0.3, { delay: d, lp: 500 }));
      hiss(o, 0.25, 1.5, [[0, 2000]], { delay: 2.35, decay: true }); voice(o, 'square', [[0, 300], [0.2, 80]], 0.25, 0.2, { delay: 2.35, lp: 1200 }); },
    spooky(o) { voice(o, 'sine', [[0, 260], [0.8, 520], [1.6, 330], [2.4, 600], [3, 220]], 3, 0.3, { trem: 6, tremDepth: 0.3 });
      voice(o, 'triangle', [[0, 262], [0.8, 524], [1.6, 333], [2.4, 604], [3, 222]], 3, 0.1); },
    cackle(o) { for (let i = 0; i < 7; i++) { const hz = 900 - i * 60;
      voice(o, 'square', [[0, hz], [0.12, hz * 0.8]], 0.14, 0.12, { delay: i * 0.17, lp: 2500 }); } },
    dog(o) { [0, 0.4].forEach(d => { voice(o, 'sawtooth', [[0, 380], [0.05, 520], [0.18, 180]], 0.2, 0.35, { delay: d, lp: 1400 });
      hiss(o, 0.15, 0.6, [[0, 1200]], { delay: d, type: 'bandpass', decay: true }); }); },
    bull(o) { [0, 0.3].forEach(d => hiss(o, 0.22, 1, [[0, 1500], [0.2, 600]], { delay: d, type: 'bandpass', q: 2, decay: true }));
      voice(o, 'sawtooth', [[0, 130], [0.3, 150], [1.4, 105]], 1.5, 0.3, { delay: 0.7, lp: 600 }); },
    magic(o) { const scale = [84, 86, 88, 91, 93, 96, 98, 100];
      for (let i = 0; i < 14; i++) voice(o, 'sine', [[0, note(scale[(i * 3) % scale.length] + (i > 7 ? 12 : 0))]], 0.35, 0.15, { delay: i * 0.1 });
      voice(o, 'triangle', [[0, note(72)]], 1.8, 0.08); },
    laser(o) { [0, 0.25, 0.5, 0.95, 1.2].forEach(d => voice(o, 'square', [[0, 1800], [0.18, 200]], 0.2, 0.12, { delay: d, lp: 3500 })); },
    digger(o) { voice(o, 'sawtooth', [[0, 45], [0.4, 70], [2.6, 50]], 2.6, 0.3, { lp: 350, trem: 18, tremDepth: 0.4 });
      for (let i = 0; i < 4; i++) voice(o, 'square', [[0, 1050]], 0.3, 0.09, { delay: 0.5 + i * 0.55, lp: 3000 }); },
    tractor(o) { voice(o, 'square', [[0, 55], [2.4, 60]], 2.4, 0.3, { lp: 400, trem: 7, tremDepth: 0.95 }); hiss(o, 2.4, 0.5, [[0, 300]], { trem: 7 }); },
    engine(o) { voice(o, 'sawtooth', [[0, 50], [0.35, 160], [0.6, 80], [1.1, 220], [1.8, 70]], 1.9, 0.3, { lp: 700, trem: 25, tremDepth: 0.35 });
      voice(o, 'square', [[0, 25], [0.35, 80], [0.6, 40], [1.1, 110], [1.8, 35]], 1.9, 0.15, { lp: 300 });
      [440, 554].forEach(hz => voice(o, 'square', [[0, hz]], 0.35, 0.08, { delay: 1.95, lp: 2000 })); }
  };
  const RULES = [
    [/ambulance/i, 'ambulance'], [/fire/i, 'fire'], [/police/i, 'police'],
    [/helicopter/i, 'helicopter'], [/airplane/i, 'airplane'], [/rocket/i, 'rocket'],
    [/tank|commando/i, 'tank'], [/school bus/i, 'bus'], [/ice cream/i, 'iceCream'],
    [/music/i, 'music'], [/submarine/i, 'submarine'], [/pirate/i, 'ship'],
    [/shark|megalodon/i, 'shark'], [/dino|triceratops|dragon|tiger|rhino/i, 'roar'],
    [/witch/i, 'cackle'], [/zombie|skeleton|grave|son-uva/i, 'spooky'],
    [/mutt/i, 'dog'], [/toro|raminator/i, 'bull'], [/unicorn|^ice$/i, 'magic'],
    [/space/i, 'laser'], [/tractor/i, 'tractor'],
    [/jcb|cement|garbage|tow|dump|bulldozer|logging|snow|harvester|crane/i, 'digger']
  ];
  const kindOf = name => (RULES.find(([re]) => re.test(name)) || [, 'engine'])[1];
  return function play(name) {
    const a = sfx.ctx();
    if (bus) { const old = bus; old.gain.setTargetAtTime(0, a.currentTime, 0.05); setTimeout(() => old.disconnect(), 400); }
    bus = a.createGain(); bus.gain.value = 1; bus.connect(a.destination);
    SOUNDS[kindOf(name)](bus);
  };
})();

// ---------- menu ----------
let size = +store.get('tm-size') || 4;
if (!SIZES.includes(size)) size = 4;

function buildMenu() {
  const wrap = $('sizes'); wrap.innerHTML = '';
  for (const n of SIZES) {
    const b = document.createElement('button');
    b.className = 'size' + (n === size ? ' last' : '');
    b.setAttribute('aria-label', `${n} by ${n}`);
    b.innerHTML = `<div class="mini" style="grid-template-columns:repeat(${Math.min(n, 5)},1fr)">${'<i></i>'.repeat(Math.min(n, 5) ** 2)}</div>${n}×${n}`;
    b.onclick = () => start(n);
    wrap.appendChild(b);
  }
}

// ---------- game ----------
let cards = [], first = null, second = null, locked = false, pairsLeft = 0, pairsTotal = 0, waitTimer = 0;

function pickTrucks(count) {
  // different-sounding trucks first so every pair has its own noise; reuse names only on huge boards
  const shuffled = LIST.map(([id, name]) => ({ id, name })).sort(() => Math.random() - .5);
  const seen = new Set(), unique = [], rest = [];
  for (const t of shuffled) (seen.has(t.name) ? rest : unique).push(t), seen.add(t.name);
  return unique.concat(rest).slice(0, count);
}

function start(n) {
  size = n; store.set('tm-size', n);
  sfx.unlock();
  clearTimeout(waitTimer);
  first = second = null; locked = false;
  const total = n * n, hasFree = total % 2 === 1, pairs = Math.floor(total / 2);
  pairsLeft = pairsTotal = pairs;
  const trucks = pickTrucks(pairs);
  const deck = trucks.flatMap(t => [t, t]).sort(() => Math.random() - .5);
  if (hasFree) deck.splice(Math.floor(total / 2), 0, null);   // free sun in the middle

  const board = $('board'); board.innerHTML = ''; cards = [];
  board.style.gridTemplateColumns = `repeat(${n}, var(--cell))`;
  board.style.gridTemplateRows = `repeat(${n}, var(--cell))`;
  deck.forEach(t => {
    const el = document.createElement('div');
    el.className = 'card' + (t ? '' : ' free');
    el.innerHTML = `<div class="inner"><div class="back"></div><div class="face">${t ? `<img src="trucks/truck${t.id}.png" alt="${t.name}" draggable="false">` : ''}</div></div>`;
    const card = { el, t, up: false, done: false };
    if (t) el.addEventListener('pointerdown', e => { e.preventDefault(); tap(card); });
    board.appendChild(el); cards.push(card);
  });
  const prog = $('progress'); prog.innerHTML = '★'.repeat(0);
  for (let i = 0; i < Math.min(pairs, 20); i++) prog.insertAdjacentHTML('beforeend', '<b>⭐</b>');

  $('menu').style.display = 'none'; document.querySelector('.home').style.display = 'none';
  $('win').classList.remove('show'); $('game').classList.add('show');
  layout();
}

function layout() {
  const pad = 14, top = 64;
  const W = innerWidth - pad * 2, H = innerHeight - top - pad;
  const cell = Math.floor(Math.min(W, H) / size);
  const b = $('board');
  b.style.setProperty('--cell', cell + 'px');
  b.style.setProperty('--gap', Math.max(2, Math.round(cell * 0.04)) + 'px');
  b.style.top = `calc(50% + ${(top - pad) / 2}px)`;
}
addEventListener('resize', layout);

function flip(card, up) { card.up = up; card.el.classList.toggle('up', up); }

function flipBackWrong() {
  clearTimeout(waitTimer);
  [first, second].forEach(c => { if (c) { flip(c, false); c.el.classList.remove('wrong'); } });
  first = second = null; locked = false;
}

function tap(card) {
  if (card.up || card.done) return;
  if (locked) flipBackWrong();              // impatient tap: tidy up the old miss and carry on
  sfx.unlock();
  flip(card, true); sfx.flip();
  if (!first) { first = card; return; }
  second = card; locked = true;
  if (first.t.id === second.t.id) return match();
  // not a pair: a sleepy little boop, then they turn back over
  setTimeout(sfx.miss, 450);
  first.el.classList.add('wrong'); second.el.classList.add('wrong');
  waitTimer = setTimeout(flipBackWrong, WRONG_MS);
}

function match() {
  const [a, b] = [first, second];
  first = second = null; locked = false;
  a.done = b.done = true;
  setTimeout(() => {
    a.el.classList.add('matched'); b.el.classList.add('matched');
    vehicleSound(a.t.name);               // the truck's own noise!
    sparkle(a.el); sparkle(b.el);
  }, 350);
  pairsLeft--;
  const on = Math.round((pairsTotal - pairsLeft) / pairsTotal * $('progress').children.length);
  [...$('progress').children].forEach((s, i) => s.classList.toggle('on', i < on));
  if (pairsLeft === 0) setTimeout(win, 3000);
}

function sparkle(el) {
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const n = Math.max(3, Math.min(7, Math.round(r.width / 14)));
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div'); s.className = 'spark';
    s.textContent = ['⭐', '✨', '🌟'][i % 3];
    const ang = Math.random() * Math.PI * 2, d = 40 + Math.random() * 90;
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * d + 'px'); s.style.setProperty('--dy', Math.sin(ang) * d - 30 + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}

function win() {
  $('win').classList.add('show');
  sfx.cheer();
  for (let i = 0; i < 24; i++) setTimeout(() => {
    const s = document.createElement('div'); s.className = 'spark'; s.textContent = ['⭐', '🎉', '✨', '🚚'][i % 4];
    s.style.left = Math.random() * innerWidth + 'px'; s.style.top = innerHeight * .8 + 'px';
    s.style.setProperty('--dx', (Math.random() - .5) * 200 + 'px'); s.style.setProperty('--dy', -innerHeight * (.4 + Math.random() * .5) + 'px');
    s.style.fontSize = '44px';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }, i * 60);
}

$('again').onclick = () => start(size);
$('bigger').onclick = () => start(SIZES[Math.min(SIZES.indexOf(size) + 1, SIZES.length - 1)]);

// back to the menu only by *holding* the corner button, so little fingers can't exit by accident
(() => {
  const btn = $('menuBtn'); let t = 0;
  const stop = () => { clearTimeout(t); btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', () => { btn.classList.add('holding'); t = setTimeout(() => { stop(); toMenu(); }, 700); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => btn.addEventListener(e, stop));
})();
function toMenu() {
  clearTimeout(waitTimer);
  $('game').classList.remove('show'); $('win').classList.remove('show');
  $('menu').style.display = ''; document.querySelector('.home').style.display = '';
  buildMenu();
}

buildMenu();
</script>
